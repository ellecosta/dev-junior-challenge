version: '3.8'

services:
  mock-service:
    build: ./mock-service
    ports:
      - "4000:4000"
    environment:
      - PORT=4000

  api:
    build: ./api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - CADASTRO_URL=http://mock-service:4000
    depends_on:
      - mock-service
    volumes:
      - ./api:/app
      - /app/node_modules

  web:
    build: ./web
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - api
    volumes:
      - ./web:/app
      - /app/node_modules
